<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F3E6DA" />
  <title>Truque do Café — Descubra o seu ritual ideal</title>
  <meta name="description" content="Um ritual de cuidado que transforma de dentro para fora. Descubra o que trava o seu corpo." />

  <!-- Poppins (identidade oficial da marca) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/quiz.css" />
</head>
<body>
  <main class="quiz-shell">
    <header class="topbar">
      <!-- Logo da marca (SVG injetado por assets.js) -->
      <div class="logo" id="logo" aria-label="Truque do Café"></div>

      <div class="progress-row" id="progress-row">
        <button id="back-btn" class="back-btn" type="button" aria-label="Voltar">&larr;</button>
        <div class="progress-wrap" role="progressbar" aria-label="Progresso" aria-valuemin="0" aria-valuemax="100">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
        <span id="progress-pct" class="progress-pct">0%</span>
      </div>
    </header>

    <!-- Cada tela é montada aqui -->
    <section id="stage" class="stage" aria-live="polite"></section>
  </main>

  <script src="js/quiz-data.js"></script>
  <script src="js/assets.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/result.js"></script>
  <script src="js/render.js"></script>
  <script>
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", function () { window.QuizRender.boot(); });
    else window.QuizRender.boot();
  </script>
</body>
</html>
